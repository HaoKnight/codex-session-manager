[package]
name = "codex-session-manager"
version = "1.3.0"
description = "Audit and repair local Codex project and session paths"
authors = ["H-Knight"]
edition = "2021"

[lib]
name = "codex_session_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
chrono = { version = "0.4.39", features = ["serde"] }
rusqlite = { version = "0.32.1", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.2.5", features = ["image-png"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2"
thiserror = "2.0"
walkdir = "2.5"
